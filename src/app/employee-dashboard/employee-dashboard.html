<div class="dashboard">
  <div class="profile-card">
    <img [src]="employee.image || ''" alt="Profile" class="avatar" />
    <h2>{{ employee.name }}</h2>
    <p>{{ employee.email }}</p>
    <span class="role-tag">{{ employee.role || 'EMPLOYEE' }}</span>
  </div>

  <div class="overview">
    <div class="overview-card">
      <h3>📊 Attendance</h3>
      <p *ngIf="assignedTasks.attendance; else noAtt">{{ assignedTasks.attendance }}%</p>
      <ng-template #noAtt><span class="gray">Not Assigned</span></ng-template>
    </div>

    <div class="overview-card">
      <h3>💼 Current Project</h3>
      <p *ngIf="assignedTasks.project; else noProj">{{ assignedTasks.project }}</p>
      <ng-template #noProj><span class="gray">No Project Assigned</span></ng-template>
    </div>

    <div class="overview-card tasks">
      <h3>📝 Your Tasks</h3>
      <ul *ngIf="assignedTasks.tasks?.length; else noTasks">
        <li *ngFor="let task of assignedTasks.tasks">{{ task }}</li>
      </ul>
      <ng-template #noTasks><span class="gray">No Tasks Yet</span></ng-template>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-settings" (click)="openSettings()">⚙ Edit Profile</button>
    <button class="btn-logout" (click)="logout()">Logout</button>
  </div>
</div>
