<div class="settings-container">
  <h2>👤 Profile Settings</h2>

  <form (ngSubmit)="updateProfile()" autocomplete="off">
    <div class="profile-preview">
      <img [src]="user.image || defaultImage" alt="Profile Preview" />
    </div>

    <label>Full Name</label>
    <input type="text" [(ngModel)]="user.name" name="name" placeholder="Enter your name" />

    <label>Email</label>
    <input type="email" [(ngModel)]="user.email" name="email" disabled />

    <label>Department</label>
    <input type="text" [(ngModel)]="user.department" name="department" placeholder="e.g. Engineering" />

    <label>Profile Image</label>
    <input type="file" (change)="onImageUpload($event)" accept="image/*" />

    <button type="submit" class="btn-save">Save Changes</button>
  </form>

  <button class="btn-back" (click)="goBack()">← Back to Dashboard</button>
</div>
