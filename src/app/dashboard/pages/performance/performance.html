<div class="performance-container">
  <h2>🏆 Employee Performance Dashboard</h2>

  <div class="summary-section">
    <h3>Overall Company Performance: {{ getOverallAverage() }}%</h3>
    <div class="progress">
      <div class="progress-bar" [style.width.%]="getOverallAverage()"
        [style.background]="getPerformanceColor(getOverallAverage())"></div>
    </div>
  </div>

  <div class="cards">
    <div class="employee-card" *ngFor="let emp of employees">
      <img [src]="emp.image || 'assets/default-avatar.png'" alt="Employee" class="emp-img" />
      <h3>{{ emp.name }}</h3>
      <p><strong>Department:</strong> {{ emp.department }}</p>
      <p><strong>Attendance:</strong> {{ emp.attendance }}%</p>
      <p><strong>Tasks Completed:</strong> {{ emp.tasksCompleted }}/{{ emp.totalTasks }}</p>
      
      <div class="progress">
        <div class="progress-bar"
             [style.width.%]="calculatePerformance(emp)"
             [style.background]="getPerformanceColor(calculatePerformance(emp))"></div>
      </div>
      <p class="rating">⭐ {{ emp.rating }}/5</p>
    </div>
  </div>
</div>
