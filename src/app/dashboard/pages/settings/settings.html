<div class="settings-container">
  <h2>⚙️ Settings</h2>
  <p class="subtitle">Manage your preferences, profile, and app experience.</p>

  <!-- Profile Section -->
  <div class="settings-card">
    <h3>🧑 Profile Picture</h3>
    <div class="profile-upload">
      <img [src]="profileService.hrProfile.image" alt="Profile" class="profile-img" />
      <input type="file" id="fileUpload" accept="image/*" (change)="onFileSelected($event)" />
      <label for="fileUpload" class="upload-btn">Upload New</label>
    </div>
  </div>

  <!-- Theme Section -->
  <div class="settings-card">
    <h3>🎨 Theme Preferences</h3>
    <p>Select your preferred appearance mode.</p>
    <div class="theme-selector">
      <select>
        <option>Dark</option>
        <option>Light</option>
        <option>System</option>
      </select>
    </div>
  </div>

  <!-- Notification Section -->
  <div class="settings-card">
    <h3>🔔 Notifications</h3>
    <p>Customize which notifications you receive.</p>
    <div class="notification-options">
      <label><input type="checkbox" checked /> Employee updates</label>
      <label><input type="checkbox" /> Weekly reports</label>
      <label><input type="checkbox" checked /> System alerts</label>
    </div>
  </div>

  <!-- App Controls -->
  <div class="settings-actions">
    <button class="save-btn">💾 Save Settings</button>
    <button class="reset-btn" (click)="profileService.updateProfileImage('assets/hr-default.png')">
      ♻️ Reset to Default
    </button>
  </div>
</div>
