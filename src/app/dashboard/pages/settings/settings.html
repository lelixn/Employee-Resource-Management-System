<div class="settings-container">
  <h2>⚙️ Profile & Theme Settings</h2>

  <div class="settings-card">
    <div class="profile-section">
      <img [src]="previewImage || 'assets/default-avatar.png'" alt="Profile Picture" class="profile-img" />
      <label class="upload-btn">
        📸 Change Photo
        <input type="file" (change)="onFileSelected($event)" accept="image/*" />
      </label>
    </div>

    <div class="info-section">
      <label>Full Name:</label>
      <input type="text" [(ngModel)]="user.name" placeholder="Enter full name" />

      <label>Email:</label>
      <input type="email" [(ngModel)]="user.email" placeholder="Enter email" />

      <label>Password:</label>
      <input type="password" [(ngModel)]="user.password" placeholder="Enter new password" />

      <button class="save-btn" (click)="updateProfile()">💾 Save Changes</button>
      <button class="reset-btn" (click)="resetDefaults()">🔄 Reset</button>
    </div>
  </div>

  <div class="theme-section">
    <h3>🎨 Choose Theme</h3>
    <div class="theme-buttons">
      <button (click)="changeTheme('light')" [class.active]="selectedTheme === 'light'">☀️ Light</button>
      <button (click)="changeTheme('dark')" [class.active]="selectedTheme === 'dark'">🌙 Dark</button>
    </div>
  </div>
</div>
