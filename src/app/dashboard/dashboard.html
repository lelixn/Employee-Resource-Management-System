<div class="dashboard-root">
  <!-- Sidebar -->
  <aside class="sidebar" #sidebar>
    <div class="brand" (click)="goToLanding()">ERMS</div>
    <nav>
      <a routerLink="overview" routerLinkActive="active">Overview</a>
      <a routerLink="employees" routerLinkActive="active">Employees</a>
      <a routerLink="analytics" routerLinkActive="active">Analytics</a>
      <a routerLink="performance" routerLinkActive="active">Performance</a>
      <a routerLink="announcements" routerLinkActive="active">Announcements</a>
      <a routerLink="settings" routerLinkActive="active">Settings</a>
    </nav>

    <div class="logout-section">
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main">
    <header class="topbar" #topbar>
      <div class="search">
        <input placeholder="Search employees..." [(ngModel)]="searchQuery" (input)="filterEmployees()" />
      </div>
      <button class="btn-outline" [class.spin]="refreshing" (click)="refresh()">⟳</button>
      <div class="user-avatar" (click)="openProfile()">
        <img [src]="hrProfile.image" alt="User Avatar" />
      </div>
    </header>


<!-- Floating Add Button -->


    <section class="content" #content>
      <router-outlet></router-outlet>
    </section>
  </div>
</div>


<!-- Modal -->
<div class="modal" *ngIf="hrProfileOpen">
  
  <div class="modal-card profile-card">
    <img [src]="hrProfile.image" class="profile-img" />
    <h3>{{ hrProfile.name }}</h3>
    <p>{{ hrProfile.role }}</p>
    <p>{{ hrProfile.email }}</p>
    <button class="btn-primary" (click)="closeProfile()">Close</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" *ngIf="showingToast">{{ toastMessage }}</div>
