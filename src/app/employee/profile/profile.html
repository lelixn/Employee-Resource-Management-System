<div class="profile-container">
  <div class="profile-card">
    <img [src]="employee.image || 'assets/default-profile.png'" class="avatar" alt="Profile Image" />
    <h2>{{ employee.name }}</h2>
    <p class="email">{{ employee.email }}</p>
    <p class="role-badge">{{ employee.role }}</p>

    <div *ngIf="!editing" class="info-section">
      <p><strong>🏢 Department:</strong> {{ employee.department }}</p>
      <p><strong>💰 Salary:</strong> ₹{{ employee.salary }}</p>
      <button class="edit-btn" (click)="enableEdit()">✏️ Edit Profile</button>
    </div>

    <div *ngIf="editing" class="edit-form">
      <input [(ngModel)]="employee.name" placeholder="Name" />
      <input [(ngModel)]="employee.email" placeholder="Email" />
      <input [(ngModel)]="employee.department" placeholder="Department" />
      <input [(ngModel)]="employee.salary" type="number" placeholder="Salary" />
      <input [(ngModel)]="employee.image" placeholder="Profile Image URL" />

      <div class="btn-group">
        <button class="save-btn" (click)="saveProfile()">💾 Save</button>
        <button class="cancel-btn" (click)="cancelEdit()">Cancel</button>
      </div>
    </div>
  </div>
</div>
