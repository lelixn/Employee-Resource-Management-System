<div class="register-wrapper">
  <div class="register-card">
    <h2 class="register-title">Create an Account ✏️</h2>

    <form autocomplete="off">
      <input
        type="text"
        [(ngModel)]="name"
        placeholder="Full Name"
        name="name"
        required
        autocomplete="off"
      />
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Email"
        name="email"
        required
        autocomplete="new-email"
      />
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Password"
        name="password"
        required
        autocomplete="new-password"
      />

      <button type="button" (click)="register()" [disabled]="loading">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading">Registering...</span>
      </button>
    </form>

    <p class="message" *ngIf="message" [class.error]="message.startsWith('❌')" [class.success]="message.startsWith('✅')">{{ message }}</p>

    <p class="bottom-text">
      Already have an account?
      <a (click)="goToLogin()">Login</a>
    </p>
  </div>
</div>
