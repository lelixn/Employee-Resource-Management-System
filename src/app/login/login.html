<div class="login-wrapper">
  <!-- Left Illustration -->
  <div class="login-left">
    <img src="assets/login-illustration.png" alt="Login Illustration" class="login-image" />
  </div>

  <!-- Right Form Card -->
  <div class="login-card">
    <h2>Welcome Back 👋</h2>
    <p>Please sign in to continue</p>

    <form (ngSubmit)="onLogin()">
      <input type="email" placeholder="Enter your email" [(ngModel)]="email" name="email" required />
      <input type="password" placeholder="Enter your password" [(ngModel)]="password" name="password" required />

      <button type="submit">Login</button>
    </form>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <p class="switch">
      Don’t have an account? <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
